name: rocknix

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: rocknix card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, Task and Bun
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake file
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"

      - name: Build the tree
        run: task dist:rocknix OUT=slot-rocknix

      - name: Check what is about to ship
        run: |
          set -eu
          file slot-rocknix/System/slot | grep -q aarch64
          for core in mgba gpsp gambatte; do
            file "slot-rocknix/System/${core}_libretro.so" | grep -q aarch64
          done
          test -f slot-rocknix/System/rocknix.sh

      - uses: actions/upload-artifact@v7
        with:
          name: slot-rocknix-${{ github.sha }}
          path: slot-rocknix
          if-no-files-found: error
