[package]
name = "slot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Slot²: the integration tests are one program, tests/all.rs, plus the few below.
autotests = false

[features]
default = ["host"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "slot-gfx/host"]
device = ["slot-gfx/device"]
romm = []

[dependencies]
slot-achievements = { path = "../slot-achievements" }
fontdue = { workspace = true }
slot-gfx = { path = "../slot-gfx", default-features = false }
slot-input = { path = "../slot-input" }
slot-power = { path = "../slot-power" }
slot-retro = { path = "../slot-retro" }
slot-store = { path = "../slot-store" }
slot-ui = { path = "../slot-ui" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
libloading = { workspace = true }
libc = { workspace = true }
lz4_flex = { workspace = true }
png = { workspace = true }
qrcode = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
ureq = { workspace = true }
tungstenite = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
crc32fast = { workspace = true }
flate2 = { workspace = true }
jpeg-decoder = { workspace = true }
image-webp = { workspace = true }

[dev-dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }
rqrr = "0.11"

[[test]]
name = "tests"
path = "tests/all.rs"

# These change state the whole process shares (environment variables, the Wi-Fi worker
# that `wifi::wait_online` asks, the ROM header index each boot loads), which would reach
# the other tests in one program.
[[test]]
name = "header_index_boot"
path = "tests/header_index_boot.rs"

[[test]]
name = "wifi_worker"
path = "tests/wifi_worker.rs"

[[test]]
name = "core"
path = "tests/core.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[test]]
name = "gb_palette_recolour"
path = "tests/gb_palette_recolour.rs"

[[test]]
name = "studio_state"
path = "tests/studio_state.rs"

[[test]]
name = "romm_ui"
path = "tests/romm_ui.rs"
required-features = ["romm"]
